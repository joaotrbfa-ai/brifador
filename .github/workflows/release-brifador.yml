name: Release Brifador

# Gera os instaladores do Brifador (Windows x64 e macOS Apple Silicon) e cria
# um Release em rascunho com eles e o latest.json do atualizador.
# Sem assinatura de código: Windows mostra o aviso do SmartScreen e o macOS
# pede "botão direito → Abrir" na primeira vez (ver docs/INSTALACAO.md).
#
# Segredos necessários no repositório:
#   TAURI_SIGNING_PRIVATE_KEY           conteúdo de ~/.tauri/brifador-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  vazio (a chave foi gerada sem senha)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # O llama-cpp-sys-2 repassa variáveis CMAKE_* ao CMake. No macOS o cpp-httplib
  # acha o OpenSSL do Homebrew e não compila; o llama-helper não usa HTTPS,
  # então escondemos o OpenSSL (o CMake só avisa e segue sem ele).
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            helper_features: ""
            helper_bin: llama-helper.exe
            sidecar: llama-helper-x86_64-pc-windows-msvc.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            helper_features: "--features metal"
            helper_bin: llama-helper
            sidecar: llama-helper-aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      # Actions fixadas por SHA de commit: esta job recebe a chave de assinatura
      # do atualizador, então nenhuma action pode mudar sem revisão. Ao atualizar,
      # resolva a tag para o SHA (gh api repos/<dono>/<repo>/commits/<tag> --jq .sha).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Com SHA, a action não infere a toolchain pelo nome da ref: "toolchain"
      # precisa ser explícito (antes vinha de @stable).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      # O bindgen 0.69 do whisper-rs-sys gera structs opacas com LLVM muito novo.
      - name: Instalar LLVM 18 (Windows)
        if: matrix.platform == 'windows-latest'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: "18.1.8"

      - name: Apontar LIBCLANG_PATH (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "LIBCLANG_PATH=$LLVM_PATH/bin" >> "$GITHUB_ENV"

      - name: Dependências do frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Compilar o sidecar llama-helper
        shell: bash
        run: |
          cargo build --release -p llama-helper ${{ matrix.helper_features }}
          mkdir -p frontend/src-tauri/binaries
          cp "target/release/${{ matrix.helper_bin }}" "frontend/src-tauri/binaries/${{ matrix.sidecar }}"

      - name: Gerar instaladores e o Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Brifador v__VERSION__
          releaseBody: |
            Transcritor de reuniões grátis, local e sem bot.
            Como instalar: https://github.com/${{ github.repository }}/blob/main/docs/INSTALACAO.md
            - Windows: baixe o arquivo `_x64-setup.exe`
            - Mac (Apple Silicon): baixe o arquivo `.dmg`
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
